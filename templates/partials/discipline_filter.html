<!--
  The Discipline filter, for any toolbar that lists rows spanning departments.

  Include it with an `id` argument — students.html is a live example. (Written
  in prose on purpose: an include tag spelled out here would be a real tag, not
  an illustration, and this file would include itself forever. HTML comments
  hide things from the browser, not from Django.)

  Offers every discipline rather than only the institute's own, because the
  table it filters can contain rows from a discipline that has since been
  revoked — and hiding the filter for those would make them unfindable.
  `filter_disciplines` comes from the site context processor, so no view has to
  remember to supply it.
-->
<select class="form-select form-select-sm ga-discipline-filter"
        id="{{ id|default:'f-discipline' }}"
        {% if name %}name="{{ name }}"{% endif %}
        style="max-width:{{ width|default:'220px' }}"
        title="Which broad field these belong to">
  <option value="">All disciplines</option>
  {% for d in filter_disciplines %}
  <option value="{{ d.value }}">{{ d.label }}</option>{% endfor %}
</select>
