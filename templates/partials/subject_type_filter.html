<!--
  The Subject-type filter, for any toolbar that already has a Subject filter.

  Include it with an `id` argument — see subjects.html for a live example.
  (Written in prose on purpose: an include tag written out here would be a real
  tag, not an illustration, and the file would include itself forever. HTML
  comments hide things from the browser, not from Django.)

  `subject_types` comes from the site context processor, so no view has to
  remember to supply it. Pass `width` to match the neighbouring controls.
-->
<select class="form-select form-select-sm ga-subject-type"
        id="{{ id|default:'f-subject-type' }}"
        {% if name %}name="{{ name }}"{% endif %}
        style="max-width:{{ width|default:'170px' }}"
        title="Theory, practical or other">
  <option value="">All types</option>
  {% for t in subject_types %}<option value="{{ t.value }}">{{ t.label }}</option>{% endfor %}
</select>
