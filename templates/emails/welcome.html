{% extends "emails/base_email.html" %}{% block content %}
<h2 style="margin:0 0 8px;font-size:19px">Welcome, {{ user.short_name }} 👋</h2>
<p style="color:#475569;font-size:14px">Your {{ user.get_role_display }} account is active. You can sign in any time with <b>{{ user.email }}</b>.</p>
<div style="text-align:center;margin:24px 0">
  <a href="{{ login_url }}" style="background:#4f46e5;color:#fff;text-decoration:none;padding:12px 28px;border-radius:10px;font-weight:600;display:inline-block">Go to {{ SITE_NAME }}</a>
</div>
{% endblock %}
